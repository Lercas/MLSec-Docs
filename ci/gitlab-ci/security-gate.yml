# Integration scaffold: requires project-owned adapters, reviewed tool locks and trust data.
# Disabled until explicit opt-in; see ci/README.md. Not a production-ready pipeline.
# MLSec Security Gate Template (GitLab CI)
# Переиспользуемый include-шаблон для корпоративных pipeline.
# Подключение:
#
#   include:
#     - project: 'security/mlsec-common'
#       file: '/ci/gitlab-ci/security-gate.yml'
#   stages:
#     - build
#     - security-gate   # добавить этот stage
#     - deploy
#
# Требуемые переменные (GitLab Settings > CI/CD > Variables):
#   COSIGN_PRIVATE_KEY, COSIGN_PASSWORD
#   OPA_POLICY_BUNDLE_URL (опционально)
#   SLACK_WEBHOOK (опционально)

.mlsec-security-gate-base:
  stage: security-gate
  image: python:3.12
  tags: [mlsec]
  rules:
    - if: '$MLSEC_INTEGRATION_ENABLED == "true" && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  before_script:
    - apt-get update && apt-get install -y jq curl
    - bash ci/scripts/install-opa.sh /tmp/mlsec-opa

# ----------------------------------------------------------------------
# Data gate: OPA + PII scan
# ----------------------------------------------------------------------
mlsec:data-gate:
  extends: .mlsec-security-gate-base
  script:
    - pip install "presidio-analyzer==2.2.366" "presidio-anonymizer==2.2.366" "great-expectations==1.25.0"
    - python -m spacy download ru_core_news_lg
    - |
      if [ -n "$OPA_POLICY_BUNDLE_URL" ]; then
        echo "Remote policy replacement disabled: verify a signed bundle and select its entrypoint in a trusted platform adapter" >&2
        exit 2
      fi
    - /tmp/mlsec-opa eval -d opa/data-governance.rego -i data-card-input.json "data.ml.data_governance.allow" > data-gate.json
    - jq -e '.result[0].expressions[0].value == true' data-gate.json
    - python -m great_expectations checkpoint run data_checkpoint
    - python scripts/pii_scan.py --input data/ --report reports/pii.json
  artifacts:
    paths: [reports/, data-gate.json]
    expire_in: 30 days
    when: always
  allow_failure: false

# ----------------------------------------------------------------------
# Model gate: OPA deployment policy + signature
# ----------------------------------------------------------------------
mlsec:model-gate:
  extends: .mlsec-security-gate-base
  script:
    - curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
    - echo "${COSIGN_SHA256:?approved cosign v3.1.4 checksum required}  /usr/local/bin/cosign" | sha256sum -c -
    - chmod +x /usr/local/bin/cosign
    - python scripts/build_opa_input.py --model artifacts/model/ --reports reports/ --out model-input.json
    - /tmp/mlsec-opa eval -d opa/model-deployment.rego -d "${OPA_TRUST_DATA:?trusted verifier data file required}" -i model-input.json "data.ml.deployment.allow" > gate.json
    - jq -e '.result[0].expressions[0].value == true' gate.json
    - cosign sign-blob --key env://COSIGN_PRIVATE_KEY artifacts/model/model.safetensors --output-signature artifacts/model/model.safetensors.sig
    - cosign verify-blob --key env://COSIGN_PUBLIC_KEY --signature artifacts/model/model.safetensors.sig artifacts/model/model.safetensors
  artifacts:
    paths: [artifacts/, gate.json]
    expire_in: 365 days
  allow_failure: false

# ----------------------------------------------------------------------
# Supply chain: SBOM + ML-BOM + CVE
# ----------------------------------------------------------------------
mlsec:supply-chain:
  extends: .mlsec-security-gate-base
  script:
    - pip install "cyclonedx-bom==8.0.1"
    - cyclonedx-py requirements requirements.lock -o artifacts/sbom.cdx.json
    - python scripts/gen_mlbom.py --model artifacts/model/ --out artifacts/mlbom.cdx.json
    - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - trivy fs --exit-code 1 --severity CRITICAL,HIGH .
    - trivy sbom --exit-code 1 --severity CRITICAL,HIGH artifacts/sbom.cdx.json
  artifacts:
    paths: [artifacts/sbom.cdx.json, artifacts/mlbom.cdx.json]
    expire_in: 365 days

# ----------------------------------------------------------------------
# Adversarial + bias + red team
# ----------------------------------------------------------------------
mlsec:adversarial:
  extends: .mlsec-security-gate-base
  script:
    - pip install -r requirements.lock --require-hashes
    - python scripts/adversarial_test.py --model artifacts/model/ --report reports/adv.json
    - python scripts/bias_analysis.py --model artifacts/model/ --report reports/bias.json
  artifacts:
    paths: [reports/]
    expire_in: 90 days

mlsec:red-team:
  extends: .mlsec-security-gate-base
  script:
    - pip install "garak==0.17.1"
    - garak --target_type huggingface --target_name artifacts/model/ \
            --spec probes.promptinject,probes.encoding,probes.malwaregen,probes.dan \
            --report_prefix reports/garak
    - python scripts/aggregate_garak.py --in reports/ --out reports/garak-summary.json
    - python -c "import sys, json; r=json.load(open('reports/garak-summary.json')); sys.exit(0 if r['overall_failure_rate'] < 0.05 else 1)"
  artifacts:
    paths: [reports/]
    expire_in: 90 days
  rules:
    - if: '$MLSEC_INTEGRATION_ENABLED == "true" && $CI_COMMIT_REF_PROTECTED == "true" && ($MODEL_TIER == "1" || $MODEL_TIER == "2")'

# ----------------------------------------------------------------------
# Notification на failure
# ----------------------------------------------------------------------
mlsec:notify-failure:
  stage: security-gate
  image: alpine:3
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ -n "$SLACK_WEBHOOK" ]; then
        curl -X POST "$SLACK_WEBHOOK" \
          -H 'Content-Type: application/json' \
          -d "{\"text\": \":rotating_light: MLSec gate failed in $CI_PROJECT_PATH pipeline $CI_PIPELINE_ID: $CI_PIPELINE_URL\"}"
      fi
  rules:
    - if: '$MLSEC_NOTIFICATIONS_ENABLED == "true" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_failure
    - when: never
